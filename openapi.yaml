  /health/ready:
    get:
      tags:
        - Operations
      summary: Readiness — should this instance receive traffic?
      description: "Requires Postgres and applied migrations. Redis being down does
        NOT make the instance unready: the service degrades to uncached reads
        and keeps serving correctly."
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: {}
